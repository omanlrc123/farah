:root{--red:#9b2335;--green:#2f7d5b;--blue:#2b6cb0;--gold:#d89b16;--brown:#7a4a1e;--cream:#fdf6e3;--ink:#3b2a14;
 --kufi:KufiE,"Segoe UI",sans-serif;--body:CairoE,"Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#5b21b6}html,body{min-height:100%}
body{font-family:var(--body);color:var(--ink);background:linear-gradient(160deg,#1e3a8a 0%,#6d28d9 45%,#db2777 100%);background-attachment:fixed;overflow-x:hidden}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
#sky i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90;width:100%;height:100%}
.app{position:relative;z-index:2;max-width:820px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;align-items:center;gap:8px;color:#fff;margin-bottom:12px;min-height:44px}
.top .who{flex:1;font:800 clamp(15px,3.6vw,19px) var(--body);display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .av{font-size:28px}
.pill{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);border-radius:22px;padding:5px 14px;font:800 16px var(--body);color:#fff}
.pts{background:var(--gold);border:none}
.ib{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer}
.card{background:var(--cream);border-radius:24px;box-shadow:0 14px 40px rgba(0,0,0,.3);padding:clamp(16px,4vw,28px);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;inset:8px;border:3px double #e7d3a3;border-radius:18px;pointer-events:none}
h1{font:700 clamp(30px,8vw,52px)/1.25 var(--kufi);color:var(--red);text-align:center}
h2{font:700 clamp(24px,6vw,36px)/1.3 var(--kufi);color:var(--red);text-align:center;margin-bottom:6px}
.sub{text-align:center;font:700 clamp(14px,3.6vw,18px)/1.6 var(--body);color:var(--brown)}
.credit{text-align:center;font:600 13px/1.6 var(--body);color:#8a6d45;margin-top:4px}
.hero{width:110px;margin:0 auto 4px;display:block}
label{display:block;font:800 17px var(--body);margin:14px 0 6px}
input[type=text],select{width:100%;font:700 19px var(--body);padding:12px 16px;border-radius:14px;border:3px solid #e7d3a3;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus{border-color:var(--gold)}
.avs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.avs button{font-size:32px;width:58px;height:58px;border-radius:16px;border:3px solid #e7d3a3;background:#fff;cursor:pointer;transition:.15s}
.avs button.on{border-color:var(--red);transform:scale(1.12);background:#fff1f2}
.btn{display:block;width:100%;border:none;cursor:pointer;border-radius:18px;padding:14px;font:900 clamp(18px,4.6vw,23px) var(--body);color:#fff;background:linear-gradient(135deg,#f59e0b,#e11d48);box-shadow:0 8px 20px rgba(225,29,72,.35);margin-top:16px;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.alt{background:linear-gradient(135deg,#0ea5e9,#4f46e5);box-shadow:0 8px 20px rgba(79,70,229,.35)}
.btn.ghost{background:#fff;color:var(--brown);border:3px solid #e7d3a3;box-shadow:none}
.err{color:#b91c1c;font:700 15px var(--body);min-height:22px;margin-top:6px;text-align:center}
/* map of levels */
.path{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.lv{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid #e7d3a3;border-radius:20px;padding:12px 14px;cursor:pointer;transition:.15s;text-align:right;width:100%;font-family:var(--body)}
.lv:active{transform:scale(.98)}
.lv .ic{width:62px;height:62px;flex:none}
.lv .ic svg{width:100%;height:100%}
.lv .tx{flex:1}
.lv b{display:block;font:900 clamp(17px,4.4vw,21px) var(--body);color:var(--ink)}
.lv small{font:700 14px var(--body);color:#8a6d45}
.lv .st{font-size:22px;white-space:nowrap}
.lv.lock{opacity:.5;filter:grayscale(.8);cursor:not-allowed}
.lv.next{border-color:var(--gold);box-shadow:0 0 0 4px rgba(216,155,22,.25);animation:glow 1.6s infinite}
@keyframes glow{50%{box-shadow:0 0 0 9px rgba(216,155,22,.08)}}
/* game common */
.ghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font:800 15px var(--body);color:var(--brown)}
.task{font:900 clamp(18px,4.8vw,24px)/1.5 var(--body);text-align:center;margin:4px 0 12px}
.fb{min-height:28px;text-align:center;font:800 17px var(--body);margin-top:10px}
.ok{color:#059669}.no{color:#b91c1c}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:#fff;border:3px solid #e7d3a3;border-radius:18px;padding:14px 8px;font:900 clamp(16px,4.2vw,20px)/1.4 var(--body);cursor:pointer;text-align:center;transition:.15s;color:var(--ink);font-family:var(--body);user-select:none}
.tile:active{transform:scale(.96)}
.tile.sel{border-color:var(--gold);background:#fffbeb;transform:scale(1.04)}
.tile.done{background:#d1fae5;border-color:#10b981;cursor:default}
.tile.bad{animation:shake .4s;background:#fee2e2;border-color:#ef4444}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.slot{border:3px dashed #d6b77a;border-radius:16px;min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:900 15px/1.35 var(--body);text-align:center;padding:6px;background:rgba(255,255,255,.5)}
.slot .y{font:800 12px var(--body);color:#8a6d45}
.slot.f{border-style:solid;border-color:#10b981;background:#d1fae5;animation:pop .4s}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.bin{border:3px dashed #a78bfa;border-radius:18px;min-height:130px;padding:8px;background:#f5f3ff;display:flex;flex-direction:column;gap:6px;align-items:stretch;cursor:pointer}
.bin h4{text-align:center;font:900 18px var(--body);color:#5b21b6}
.bin .tile{font-size:14px;padding:8px 4px}
.mapw{position:relative;border-radius:16px;overflow:hidden;border:4px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.mapw img{width:100%;display:block}
.hs{position:absolute;transform:translate(-50%,-50%);width:clamp(20px,4.5vw,30px);height:clamp(20px,4.5vw,30px);opacity:.9;border-radius:50%;border:3px solid #fff;background:var(--gold);cursor:pointer;box-shadow:0 0 0 0 rgba(216,155,22,.8);animation:ping 1.6s infinite}
@keyframes ping{70%{box-shadow:0 0 0 14px rgba(216,155,22,0)}}
.hs.g{background:#10b981;animation:none}.hs.r{background:#ef4444}
.hs span{position:absolute;bottom:115%;right:50%;transform:translateX(50%);background:#111827;color:#fff;font:800 12px var(--body);padding:2px 8px;border-radius:8px;white-space:nowrap}
.tbar{height:12px;background:#e5e7eb;border-radius:8px;overflow:hidden;margin:6px 0 12px}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,#e11d48,#f59e0b,#10b981)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.opts{grid-template-columns:1fr}.slots{grid-template-columns:repeat(2,1fr)}.bins{grid-template-columns:1fr}}
.res{text-align:center}
.stars{font-size:clamp(44px,12vw,64px);letter-spacing:6px}
.big{font:900 clamp(30px,8vw,46px) var(--body);color:var(--red)}
table{width:100%;border-collapse:separate;border-spacing:0 6px;font:700 clamp(14px,3.6vw,17px) var(--body)}
th{color:#8a6d45;font-size:14px;padding:4px}
td{background:#fff;padding:10px 6px;text-align:center}
td:first-child{border-radius:0 12px 12px 0}td:last-child{border-radius:12px 0 0 12px}
tr.me td{background:#fef3c7}
.medal{font-size:22px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.tabs button{border:2px solid #e7d3a3;background:#fff;border-radius:16px;padding:5px 14px;font:800 15px var(--body);cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--red);color:#fff;border-color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .card{max-width:420px;width:100%}
.copyarea{width:100%;font:700 15px/1.6 var(--body);border:2px solid #e7d3a3;border-radius:12px;padding:10px;margin-top:8px;background:#fff;resize:none}

function tone(f,t0,d,type='sine',v=.18){if(!SOUND)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(v,a.currentTime+t0+.02);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t0+d);o.connect(g).connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.05)}catch(e){}}

const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],raf=null;
function fit(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',fit);fit();
function confetti(n){const W=cv.width,H=cv.height,cols=['#f59e0b','#e11d48','#10b981','#3b82f6','#a855f7','#fde047'];
 for(let i=0;i<n;i++)parts.push({x:W/2+(Math.random()-.5)*W*.4,y:H*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*15-4,s:Math.random()*8+5,c:cols[i%6],r:Math.random()*6,vr:(Math.random()-.5)*.3,l:130});
 if(!raf)loop()}
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.l-->0&&p.y<cv.height+30);
 parts.forEach(p=>{p.vy+=.42;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});
 raf=parts.length?requestAnimationFrame(loop):null}

/* ============ خريطة المراحل ============ */

function levels(){

 <div class="path">${LV.map((l,i)=>{const d=lv[i];const lock=i>nxt;return `<button class="lv ${lock?'lock':''} ${i===nxt?'next':''}" data-i="${i}"><span class="ic">${ICON[l.ic]}</span><span class="tx"><b>${i+1}. ${l.t}</b><small>${d?'النقاط: '+d.score:l.d}</small></span><span class="st">${d?'⭐'.repeat(d.stars)+'☆'.repeat(3-d.stars):lock?'🔒':'▶️'}</span></button>`}).join('')}</div>
 ${lv.length>=LV.length?`<button class="btn" id="fin">🏅 النتيجة النهائية</button>`:''}<button class="btn ghost" id="lb">🏆 لوحة الشرف</button></div>`;

function finishLevel(i,score,stars,msg){
 const old=prog.lv[i];if(!old||score>old.score)prog.lv[i]={score,stars};store.set('prog',prog);
 SFX.win();confetti(stars===3?200:110);
 app.innerHTML=`${topbar(levels)}<div class="card res"><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><h2>${stars===3?'رائعة! 🎉':stars===2?'أحسنتِ! 👏':'جيد! حاولي مرة أخرى لتحصلي على نجوم أكثر 💪'}</h2>
 <div class="big">+${score} نقطة</div>${msg?`<div class="why">${msg}</div>`:''}
 <button class="btn" id="nx">${i<LV.length-1?'المرحلة التالية ←':'🏅 النتيجة النهائية'}</button><button class="btn ghost" id="rp">↻ أعيدي المرحلة</button></div>`;
 wireTop(levels);$('#nx').onclick=()=>{i<LV.length-1?LV[i+1].f():final()};$('#rp').onclick=()=>LV[i].f();
}
const starsBy=m=>m===0?3:m<=2?2:1;

/* ============ ١: الترتيب ============ */
function gOrder(){
 const C=[{n:'أبو بكر الصدّيق',y:'١١–١٣ هـ'},{n:'عمر بن الخطاب',y:'١٣–٢٣ هـ'},{n:'عثمان بن عفان',y:'٢٣–٣٥ هـ'},{n:'علي بن أبي طالب',y:'٣٥–٤٠ هـ'}];
 let k=0,miss=0;
 app.innerHTML=`${topbar(levels)}<div class="card"><div class="ghead"><span>المرحلة ١</span><span id="ms">الأخطاء: 0</span></div><h2>رتّبي الخلفاء الراشدين</h2>
 <div class="task">انقري على الخلفاء بالترتيب: من الأول إلى الرابع</div>
 <div class="slots">${C.map((c,i)=>`<div class="slot" id="s${i}"><span style="font-size:24px;color:#d6b77a">${'١٢٣٤'[i]}</span></div>`).join('')}</div>
 <div class="tiles">${shuffle(C.map((c,i)=>({...c,i}))).map(c=>`<button class="tile" data-i="${c.i}">${c.n}<br><small style="color:#8a6d45">رضي الله عنه</small></button>`).join('')}</div>
 <div class="fb" id="fb"></div></div>`;
 wireTop(levels);
 app.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{ac();if(b.classList.contains('done'))return;const i=+b.dataset.i;
  if(i===k){SFX.ok();b.classList.add('done');const s=$('#s'+k);s.classList.add('f');s.innerHTML=`${C[k].n}<span class="y">${C[k].y}</span>`;k++;
   $('#fb').className='fb ok';$('#fb').textContent='✔️ صحيح!';if(k===4)setTimeout(()=>finishLevel(0,Math.max(40,100-miss*15),starsBy(miss),'الترتيب: أبو بكر ← عمر ← عثمان ← علي رضي الله عنهم. وامتد عصر الخلافة الراشدة من ١١ إلى ٤٠ هـ.'),700)}
  else{miss++;SFX.no();b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),450);$('#ms').textContent='الأخطاء: '+miss;$('#fb').className='fb no';$('#fb').textContent='ليس هذا… من جاء بعد '+(k?C[k-1].n:'وفاة الرسول ﷺ')+'؟'}});
}

/* ============ ٢: التوصيل ============ */
function gMatch(){
 const A=[['أبو بكر الصدّيق','انتخاب مباشر'],['عمر بن الخطاب','التزكية'],['عثمان بن عفان','الاختيار من بين عدد من المرشحين'],['علي بن أبي طالب','بيعة عامة']];
 let sel=null,left=4,miss=0;
 app.innerHTML=`${topbar(levels)}<div class="card"><div class="ghead"><span>المرحلة ٢</span><span id="ms">الأخطاء: 0</span></div><h2>صِلي الخليفة بطريقة اختياره</h2>
 <div class="task">انقري على الخليفة، ثم على طريقة اختياره</div>
 <div class="match"><div class="col">${A.map((a,i)=>`<button class="tile" data-c="${i}">${a[0]}</button>`).join('')}</div>
 <div class="col">${shuffle(A.map((a,i)=>[a[1],i])).map(a=>`<button class="tile" data-m="${a[1]}" style="background:#eef5ff">${a[0]}</button>`).join('')}</div></div>
 <div class="fb" id="fb"></div><div class="why" style="background:#f3e8ff;color:#4b2a6e">💡 التزكية: أن أبا بكر رضي الله عنه رشّح عمر بن الخطاب ليخلفه، وشاور الصحابة فوافقوا عليه.</div></div>`;
 wireTop(levels);
 app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ac();if(b.classList.contains('done'))return;SFX.pop();app.querySelectorAll('[data-c]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.c});
 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ac();if(b.classList.contains('done'))return;
  if(sel===null){$('#fb').className='fb no';$('#fb').textContent='اختاري الخليفة أولًا من العمود الأيمن';return}
  const c=app.querySelector(`[data-c="${sel}"]`);
  if(+b.dataset.m===sel){SFX.ok();b.classList.add('done');c.classList.remove('sel');c.classList.add('done');sel=null;left--;$('#fb').className='fb ok';$('#fb').textContent='✔️ أحسنتِ!';
   if(!left)setTimeout(()=>finishLevel(1,Math.max(40,100-miss*15),starsBy(miss),'أبو بكر: انتخاب مباشر · عمر: التزكية · عثمان: من بين المرشحين · علي: بيعة عامة. وكلها قامت على الشورى.'),700)}
  else{miss++;SFX.no();b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),450);$('#ms').textContent='الأخطاء: '+miss;$('#fb').className='fb no';$('#fb').textContent='حاولي مرة أخرى 💪'}});
}

/* ============ ٣: التصنيف ============ */
function gSort(){
 const C=[{t:'القضاء على الرِّدّة',k:[0,2]},{t:'التوسّع في الفتوحات الإسلامية',k:[0]},{t:'إنشاء الدواوين',k:[1]},{t:'جمع القرآن الكريم وكتابة المصاحف',k:[2]}];
 const B=['عسكرية ⚔️','إدارية 📋','دينية 📖'];let sel=null,left=C.length,miss=0;
 app.innerHTML=`${topbar(levels)}<div class="card"><div class="ghead"><span>المرحلة ٣</span><span id="ms">الأخطاء: 0</span></div><h2>صنّفي منجزات الخلفاء الراشدين</h2>
 <div class="task">انقري على المنجز، ثم على الصندوق المناسب</div>
 <div class="tiles" id="pool">${shuffle(C.map((c,i)=>({...c,i}))).map(c=>`<button class="tile" data-i="${c.i}">${c.t}</button>`).join('')}</div>
 <div class="bins">${B.map((b,i)=>`<div class="bin" data-b="${i}"><h4>${b}</h4></div>`).join('')}</div><div class="fb" id="fb"></div></div>`;
 wireTop(levels);
 app.querySelectorAll('#pool .tile').forEach(b=>b.onclick=()=>{ac();SFX.pop();app.querySelectorAll('#pool .tile').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b});
 app.querySelectorAll('.bin').forEach(bin=>bin.onclick=()=>{ac();if(!sel){$('#fb').className='fb no';$('#fb').textContent='اختاري منجزًا أولًا';return}
  const c=C[+sel.dataset.i];
  if(c.k.includes(+bin.dataset.b)){SFX.ok();sel.classList.remove('sel');sel.classList.add('done');sel.onclick=null;bin.appendChild(sel);sel=null;left--;$('#fb').className='fb ok';
   $('#fb').textContent=c.k.length>1?'✔️ صحيح! القضاء على الردة منجز عسكري، وله جانب ديني أيضًا لأنه حفظ أركان الإسلام.':'✔️ أحسنتِ!';
   if(!left)setTimeout(()=>finishLevel(2,Math.max(40,100-miss*15),starsBy(miss),'نحافظ على المنجزات العظيمة باعتبارها مكسبًا دينيًّا ووطنيًّا.'),1100)}
  else{miss++;SFX.no();sel.classList.add('bad');const s=sel;setTimeout(()=>s.classList.remove('bad'),450);$('#ms').textContent='الأخطاء: '+miss;$('#fb').className='fb no';$('#fb').textContent='فكّري مرة أخرى 🤔'}});
}

/* ============ ٤: صيّادة الخريطة ============ */

 const S=[{x:56,y:41,n:'بلاد الشام'},{x:68,y:45,n:'العراق'},{x:44,y:53,n:'مصر'},{x:82,y:52,n:'بلاد فارس'},{x:58.5,y:63.5,n:'المدينة المنورة'},{x:12,y:43,n:'شمال أفريقيا'},{x:67,y:74,n:'شبه الجزيرة العربية'}];

 let r=0,miss=0;

 <div class="task" id="q"></div><div class="mapw"><img src="${MAPIMG}" alt="خريطة الفتوحات الإسلامية">${S.map((s,i)=>`<button class="hs" data-i="${i}" style="left:${s.x}%;top:${s.y}%" aria-label="نقطة"></button>`).join('')}</div>
 <div class="fb" id="fb"></div><div class="note">الشكل (٢) خريطة الفتوحات الإسلامية في عصر الخلفاء الراشدين — من كتاب الطالب</div></div>`;
 wireTop(levels);
 const ask=()=>{$('#q').textContent='📍 '+R[r].q;$('#rn').textContent=(r+1).toLocaleString('ar-EG')+'/٥'};ask();
 app.querySelectorAll('.hs').forEach(h=>h.onclick=()=>{ac();const i=+h.dataset.i;
  if(i===R[r].a){SFX.ok();app.querySelectorAll('.hs span').forEach(x=>x.remove());h.classList.add('g');h.innerHTML=`<span>${S[i].n}</span>`;$('#fb').className='fb ok';$('#fb').textContent='✔️ أحسنتِ! هذه '+S[i].n;r++;
   if(r===R.length)setTimeout(()=>finishLevel(3,Math.max(40,100-miss*12),starsBy(miss),'قامت فتوحات كثيرة في عصر الخلفاء الراشدين، ومثّل عهد عمر بن الخطاب رضي الله عنه ذروتها.'),900);else setTimeout(ask,600)}
  else{miss++;SFX.no();h.classList.add('r');$('#ms').textContent='الأخطاء: '+miss;$('#fb').className='fb no';$('#fb').textContent='هذه '+S[i].n+'… ابحثي مرة أخرى';setTimeout(()=>h.classList.remove('r'),700)}});
}

/* ============ ٥: سباق الأسئلة ============ */
let QT=null;
function gQuiz(){
 const Q=shuffle(QUIZ).slice(0,10);let q=0,pts=0,right=0,streak=0;
 const show=()=>{clearInterval(QT);if(q>=Q.length){const st=right>=9?3:right>=6?2:1;return finishLevel(4,pts,st,`أجبتِ إجابة صحيحة عن ${right} من ${Q.length} أسئلة.`)}
  const c=Q[q];const t0=Date.now();const order=shuffle(c.o.map((o,i)=>[o,i]));
  app.innerHTML=`${topbar(levels)}<div class="card"><div class="ghead"><span>المرحلة ٥ · السؤال ${q+1}/${Q.length}</span><span>${streak>=2?'🔥 '+streak:''} النقاط: ${pts}</span></div>
  <div class="tbar"><i id="tb" style="width:100%"></i></div><div class="task">${c.q}</div>
  <div class="opts">${order.map(o=>`<button class="tile" data-i="${o[1]}">${o[0]}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`;
  wireTop(()=>{clearInterval(QT);levels()});
  let lastS=20;QT=setInterval(()=>{const r=20-(Date.now()-t0)/1000;const tb=$('#tb');if(!tb){clearInterval(QT);return}tb.style.width=Math.max(0,r/20*100)+'%';
   if(Math.ceil(r)<lastS){lastS=Math.ceil(r);if(lastS<=5&&lastS>0)SFX.tick()}if(r<=0)reveal(-1,0)},100);
  const reveal=(pick,rem)=>{clearInterval(QT);const bs=app.querySelectorAll('.opts .tile');bs.forEach(b=>{b.onclick=null;if(+b.dataset.i===c.a)b.classList.add('done')});
   if(pick===c.a){right++;streak++;const g=20+Math.round(rem/2)+(streak>=3?5:0);pts+=g;SFX.ok();confetti(25);$('#fb').className='fb ok';$('#fb').textContent='✔️ +'+g+(streak>=3?' 🔥 سلسلة!':'')}
   else{streak=0;SFX.no();if(pick>=0)app.querySelector(`.opts .tile[data-i="${pick}"]`).classList.add('bad');$('#fb').className='fb no';$('#fb').textContent=pick<0?'⌛ انتهى الوقت!':'✖️ الإجابة الصحيحة باللون الأخضر'}
   setTimeout(()=>{q++;show()},1600)};
  app.querySelectorAll('.opts .tile').forEach(b=>b.onclick=()=>{ac();reveal(+b.dataset.i,20-(Date.now()-t0)/1000)});
 };show();
}

/* ============ النتيجة النهائية ولوحة الشرف ============ */
function titleFor(s){return s>=600?'👑 أميرة التاريخ':s>=480?'🏅 بطلة الخلافة الراشدة':s>=350?'🌟 مؤرّخة صغيرة':'🌱 مستكشفة'}
function final(){
 const T=total();const stars=prog.lv.reduce((s,l)=>s+(l?l.stars:0),0);
 const lb=store.get('board',[]);const id=prog.name+'|'+prog.sec;const ex=lb.find(e=>e.id===id);
 if(!ex)lb.push({id,name:prog.name,sec:prog.sec,av:P.av,score:T,stars,at:Date.now()});else if(T>ex.score){Object.assign(ex,{score:T,stars,av:P.av,at:Date.now()})}
 lb.sort((a,b)=>b.score-a.score);store.set('board',lb);
 const rank=lb.findIndex(e=>e.id===id)+1;
 const txt=`🏆 مغامرة الخلافة الراشدة\nالاسم: ${prog.name}\nالشعبة: ${prog.sec}\nالنقاط: ${T}\nالنجوم: ${stars} من 15\nاللقب: ${titleFor(T).replace(/^\S+\s/,'')}`;
 SFX.win();confetti(250);
 app.innerHTML=`${topbar(levels)}<div class="card res"><div style="font-size:70px">${P.av}</div><h2>${titleFor(T)}</h2><div class="sub">${esc(prog.name)} · ${esc(prog.sec)}</div>
 <div class="big" style="margin:8px 0">${T} نقطة</div><div class="sub" style="font-size:22px">⭐ ${stars} نجمة من ١٥</div>
 <div class="sub" style="margin-top:6px">ترتيبك في لوحة الشرف على هذا الجهاز: ${rank}</div>
 <button class="btn" id="cp">📋 انسخي نتيجتك لإرسالها للمعلمة</button><textarea class="copyarea" id="ta" rows="6" readonly>${esc(txt)}</textarea>
 <button class="btn alt" id="lb">🏆 لوحة الشرف</button><button class="btn ghost" id="nw">👤 لاعبة جديدة</button></div>`;
 wireTop(levels);
 $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(txt);$('#cp').textContent='✔️ تم النسخ!'}catch(e){const t=$('#ta');t.focus();t.select();$('#cp').textContent='حدّدي النص وانسخيه يدويًا'}};
 $('#lb').onclick=board;$('#nw').onclick=newPlayer;
}
function newPlayer(){P=null;prog=null;store.set('player',null);store.set('prog',null);home()}
function board(){
 const lb=store.get('board',[]);let f='الكل';
 const draw=()=>{const rows=lb.filter(e=>f==='الكل'||e.sec===f);const me=prog?prog.name+'|'+prog.sec:'';
  $('#tb').innerHTML=rows.length?`<tr><th>#</th><th>الاسم</th><th>الشعبة</th><th>النقاط</th><th>⭐</th></tr>`+rows.map((e,i)=>`<tr class="${e.id===me?'me':''}"><td>${i<3?`<span class="medal">${['🥇','🥈','🥉'][i]}</span>`:i+1}</td><td>${esc(e.av)} ${esc(e.name)}</td><td>${esc(e.sec)}</td><td><b>${e.score}</b></td><td>${e.stars}</td></tr>`).join('')
   :`<tr><td style="border-radius:12px">لا توجد نتائج بعد… كوني الأولى! 🚀</td></tr>`;
  app.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.f===f))};
 const secs=['الكل',...SECS.filter(s=>lb.some(e=>e.sec===s))];
 app.innerHTML=`${topbar(P?levels:home)}<div class="card"><h2>🏆 لوحة الشرف</h2><div class="tabs">${secs.map(s=>`<button data-f="${s}">${s}</button>`).join('')}</div>
 <table id="tb"></table><div class="note">تُحفظ النتائج على هذا الجهاز فقط. لتجميع نتائج الطالبات من أجهزة مختلفة، تُرسل كل طالبة نتيجتها المنسوخة إلى المعلمة.</div>
 <button class="btn alt" id="cpa">📋 نسخ اللوحة كاملة</button><button class="btn ghost" id="clr">🗑️ مسح اللوحة (للمعلمة)</button><button class="btn ghost" id="bk">← رجوع</button></div>`;
 wireTop(P?levels:home);draw();
 app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{f=b.dataset.f;SFX.pop();draw()});
